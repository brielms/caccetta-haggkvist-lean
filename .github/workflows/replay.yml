name: Replay the CH research frontier
on:
  # Run only when something the replay reads has changed. README, images and
  # other documentation commits do not start a run.
  push:
    branches: [main]
    paths:
      - "**/*.lean"
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - "checkpoints/**/*.sh"
      - "checkpoints/**/*.py"
      - "evidence/**"
      - docs/check_map.py
      - docs/coverage.html
      - .github/workflows/replay.yml
  pull_request:
    paths:
      - "**/*.lean"
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - "checkpoints/**/*.sh"
      - "checkpoints/**/*.py"
      - "evidence/**"
      - docs/check_map.py
      - docs/coverage.html
      - .github/workflows/replay.yml
  workflow_dispatch:
# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          auto-config: "false"
          use-mathlib-cache: "true"
      # lean-action saves its cache before this project is built, so keep the
      # project's own build output in a separate cache.
      - name: Restore the project build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # same pin lean-action uses
        with:
          path: .lake/build
          key: ch-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            ch-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Verify archived evidence
        run: python3 evidence/check_snapshot.py
      - name: Build proof dependencies
        run: bash checkpoints/shen_extension/check_capstone.sh --build-only
      - name: Save the project build
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # same pin lean-action uses
        with:
          path: .lake/build
          key: ch-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
      - name: Test replay and catalog
        run: bash checkpoints/shen_extension/check_regressions.sh
      - name: Check coverage map against Lean
        run: |
          lake env lean docs/CoverageMap.lean > "$RUNNER_TEMP/map.log"
          python3 docs/check_map.py "$RUNNER_TEMP/map.log"
      - name: Replay the full capstone and compare the open frontier
        run: |
          export CH_FRONTIER_DIR="$RUNNER_TEMP/ch-frontier"
          status=0
          bash checkpoints/shen_extension/check_capstone.sh --replay > "$RUNNER_TEMP/replay.out" 2>&1 || status=$?
          if [ "$status" != 1 ]; then
            tail -c 3000 "$RUNNER_TEMP/replay.out"
            echo "Expected Lean's open-goal exit 1, got $status. Review the new result."
            exit 1
          fi
          python3 evidence/compare_frontier.py "$CH_FRONTIER_DIR"/replay.*/frontier.json
      - name: Save the live Lean evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: capstone-replay
          path: |
            ${{ runner.temp }}/ch-frontier
            ${{ runner.temp }}/replay.out
          if-no-files-found: ignore
          retention-days: 14
